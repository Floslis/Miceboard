<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicBoard</title>
  <!--
    GitHub Pages SPA redirect.
    pathSegmentsToKeep = 1 because the app lives at /Miceboard/
    (one path segment deep from the root).
    This redirects e.g. /Miceboard/admin → /Miceboard/?/admin
    so the index.html at /Miceboard/ can restore the real URL.
  -->
  <script>
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
